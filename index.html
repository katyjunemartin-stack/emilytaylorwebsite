<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emily Taylor | Premium Real Estate Editorial</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;600&family=Montserrat:wght@300;400;500&family=Mrs+Saint+Delafield&family=Jost:wght@300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            --ivory: #FDFBF7;
            --cream: #F9F6F0;
            --stone: #EFECE6;
            --taupe: #9E9484;
            --greige: #6E675F;
            --charcoal: #222222;
            --muted: rgba(34, 34, 34, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--charcoal);
            background-color: var(--ivory);
            line-height: 1.7;
            overflow-x: hidden;
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: 'Bodoni Moda', serif;
            font-weight: 400;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        p {
            font-weight: 300;
        }

        /* SCRIPT ACCENT */

        .script-accent {
            font-family: 'Mrs Saint Delafield', cursive;
            font-size: 42px;
            color: var(--taupe);
            text-transform: none;
            letter-spacing: 0;
        }

        /* PAGE VIEWS */

        .page-view {
            display: none;
        }

        #home-view {
            display: block;
        }

        /* HEADER */

        header {
            position: sticky;
            top: 0;
            background: rgba(253, 251, 247, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--muted);
            z-index: 1000;
            padding: 24px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            text-decoration: none;
            font-family: 'Bodoni Moda', serif;
            font-size: 1.6rem;
            color: var(--charcoal);
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 0.08em;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            align-items: center;
            gap: 24px;
        }

        .nav-menu a {
            text-decoration: none;
            color: var(--charcoal);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .nav-menu a:hover {
            opacity: 0.55;
        }

        .active-listing-nav {
            font-weight: 500;
            border-bottom: 1px dashed var(--taupe);
            padding-bottom: 2px;
        }

        /* SECTIONS */

        .section-container {
            padding: 100px 8%;
            border-bottom: 1px solid var(--muted);
            max-width: 1600px;
            margin: 0 auto;
        }

        /* GRIDS */

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        /* IMAGE PLACEHOLDERS */

        .placeholder-image {
            background-color: var(--stone);
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(34, 34, 34, 0.05);
            color: var(--greige);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            overflow: hidden;
        }

        .placeholder-image::before {
            content: '[ Architectural Photography Placeholder ]';
        }

        /* BUTTONS */

        .cta-button {
            display: inline-block;
            padding: 16px 36px;
            background-color: var(--charcoal);
            color: var(--ivory);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            border: 1px solid var(--charcoal);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
        }

        .cta-button:hover {
            background-color: transparent;
            color: var(--charcoal);
        }
