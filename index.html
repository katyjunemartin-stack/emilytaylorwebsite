<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emily Taylor | Premium Real Estate Editorial & Local Advisor</title>
    <meta name="description" content="Sophisticated real estate services by Emily Taylor. Serving Peterborough, Peterborough County, Durham Region, and the GTA. A luxury, thoughtful approach to moving.">
    
    <!-- Google Fonts Integration -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Montserrat:wght@300;400;500;600&family=Mrs+Saint+Delafield&family=Playfair+Display:ital,wght@0,400;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">

    <style>
        /* Quiet Luxury Color Palette & System Variables */
        :root {
            --ivory: #FDFBF7;
            --cream: #F9F6F0;
            --stone: #EFECE6;
            --taupe: #9E9484;
            --greige: #6E675F;
            --charcoal: #222222;
            --muted-line: rgba(34, 34, 34, 0.12);
            --transition-smooth: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Base Typography Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            background-color: var(--ivory);
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--charcoal);
            background-color: var(--ivory);
            line-height: 1.7;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Custom Editorial Typography Classes */
        h1, h2, h3, h4, .serif-display {
            font-family: 'Bodoni Moda', serif;
            font-weight: 400;
            letter-spacing: 0.05em;
            color: var(--charcoal);
        }

        .script-accent {
            font-family: 'Mrs Saint Delafield', cursive;
            font-size: 42px;
            color: var(--taupe);
            display: inline-block;
        }

        p, .sans-body {
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            font-size: 1.05rem;
            letter-spacing: 0.02em;
        }

        .jost-utility {
            font-family: 'Jost', sans-serif;
            font-weight: 400;
        }

        /* Single-Page-App Views State Router */
        .page-view {
            display: none;
            animation: fadeIn 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Default active state home router */
        #home-view {
            display: block;
        }

        /* Active view targeting via CSS hashes */
        :target {
            display: block !important;
        }
        :target ~ #home-view {
            display: none !important;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Layout Architecture & Structural Containers */
        .section-container {
            padding: 120px 8%;
            border-bottom: 1px solid var(--muted-line);
            max-width: 1600px;
            margin: 0 auto;
            position: relative;
        }

        /* Minimal Layout Fine Lines & Outlines */
        .editorial-line {
            width: 100%;
            height: 1px;
            background-color: var(--muted-line);
            margin: 40px 0;
        }

        /* Strict Neutral Proportional Image Placeholders */
        .placeholder-image {
            background-color: var(--stone);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
            border: 1px solid rgba(34, 34, 34, 0.05);
        }
        
        .placeholder-image::before {
            content: '[ Architectural Photography Placeholder ]';
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--greige);
            font-weight: 400;
            opacity: 0.6;
        }

        .placeholder-portrait::before {
            content: '[ Portrait Placeholder ]';
        }

        /* Premium Buttons & Call-to-Actions */
        .cta-button {
            display: inline-block;
            padding: 16px 36px;
            background-color: var(--charcoal);
            color: var(--ivory);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            transition: var(--transition-smooth);
            border: 1px solid var(--charcoal);
            cursor: pointer;
        }

        .cta-button:hover {
            background-color: transparent;
            color: var(--charcoal);
        }

        .cta-secondary {
            background-color: transparent;
            color: var(--charcoal);
            border-bottom: 1px solid var(--charcoal);
            padding: 8px 0;
            text-transform: uppercase;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.22em;
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        .cta-secondary:hover {
            color: var(--taupe);
            border-bottom-color: var(--taupe);
        }

        /* Refined Global Menu Bar */
        header {
            position: sticky;
            top: 0;
            background-color: rgba(253, 251, 247, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--muted-line);
            z-index: 1000;
            padding: 24px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            text-decoration: none;
            font-size: 1.6rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--charcoal);
        }

        .brand-logo span {
            font-weight: 300;
            color: var(--taupe);
        }

        .nav-menu {
            display: flex;
            list-style: none;
            align-items: center;
            gap: 28px;
        }

        .nav-menu a {
            text-decoration: none;
            color: var(--charcoal);
            font-size: 0.78rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            transition: var(--transition-smooth);
        }

        .nav-menu a:hover {
            color: var(--taupe);
        }

        .nav-menu .active-listing-nav {
            color: var(--charcoal);
            font-weight: 500;
            border-bottom: 1px dashed var(--taupe);
            padding-bottom: 2px;
        }

        /* Mobile Hamburger Drawers */
        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            z-index: 1100;
        }

        .menu-toggle span {
            width: 26px;
            height: 1px;
            background-color: var(--charcoal);
            transition: var(--transition-smooth);
        }

        /* Asymmetric Editorial Hero Elements */
        .hero-grid {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            align-items: center;
            gap: 60px;
            min-height: calc(85vh - 85px);
        }

        .hero-title-box h1 {
            font-size: clamp(2.8rem, 5vw, 4.5rem);
            line-height: 1.1;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .hero-title-box p {
            max-width: 500px;
            color: var(--greige);
            margin-bottom: 40px;
        }

        .hero-actions {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .hero-img-box .placeholder-image {
            aspect-ratio: 4 / 5;
            width: 100%;
        }

        /* Minimal Intro Layout Split */
        .intro-grid {
            display: grid;
            grid-template-columns: 0.8fr 1.2fr;
            gap: 80px;
            align-items: flex-start;
        }

        .intro-title h2 {
            font-size: 2.5rem;
            text-transform: uppercase;
            line-height: 1.2;
        }

        .intro-body {
            max-width: 700px;
        }

        .intro-body p {
            font-size: 1.2rem;
            color: var(--greige);
            margin-bottom: 30px;
        }

        /* Dual Column Buy/Sell Layout Modules */
        .services-split-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            border: 1px solid var(--muted-line);
        }

        .service-column {
            padding: 80px 10%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .service-column:first-child {
            border-right: 1px solid var(--muted-line);
        }

        .service-column h3 {
            font-size: 2.2rem;
            text-transform: uppercase;
            line-height: 1.2;
            margin-bottom: 25px;
        }

        .service-column p {
            color: var(--greige);
            margin-bottom: 40px;
        }

        .service-column .placeholder-image {
            aspect-ratio: 16 / 9;
            width: 100%;
            margin-bottom: 35px;
        }
