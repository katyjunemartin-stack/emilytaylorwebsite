<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Contact Emily Taylor | Real Estate</title>

  <meta
    name="description"
    content="Contact Emily Taylor, Sales Representative with RE/MAX Hallmark Eastern Realty INC."
  />

  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500;6..72,600&display=swap"

  />

  <style>

    /* =========================================================
       ROOT
    ========================================================= */

    :root {
      --ivory: #f7f4ee;
      --cream: #eee9df;
      --stone: #d8d0c3;
      --taupe: #a89d8e;
      --greige: #756e64;
      --charcoal: #292725;
      --burgundy: #4a0d10;
      --burgundy-dark: #39090c;
      --white: #ffffff;
      --black: #171615;
      --line: rgba(41,39,37,0.15);

      --serif: "Newsreader", Georgia, serif;
      --sans: "Proxima Nova", Arial, Helvetica, sans-serif;
    }


    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--ivory);
      color: var(--charcoal);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }


    /* =========================================================
       HEADER
    ========================================================= */

    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 20;
      background: var(--burgundy);
      color: var(--white);
    }

    .nav {
      width: min(1500px, calc(100% - 100px));
      height: 220px;
      margin: 0 auto;
      padding: 0;
      position: relative;

      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 40px;
    }

    .logo-link {
      display: flex;
      align-items: center;

      width: 220px;
      height: 220px;

      flex-shrink: 0;

      transform: translateY(-20px);
    }

    .logo-link img {
      width: 220px;
      height: 220px;

      object-fit: contain;
      object-position: center;
    }

    nav {
      position: absolute;
      top: 70px;
      right: 0;

      display: flex;
      align-items: center;

      gap: 28px;

      font-size: 11px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;

      z-index: 30;
    }

    nav a {
      color: var(--white);
      position: relative;
      white-space: nowrap;
    }

    nav a::after {
      content: "";
      position: absolute;

      left: 0;
      bottom: -7px;

      width: 0;
      height: 1px;

      background: var(--white);

      transition: width .3s ease;
    }

    nav a:hover::after {
      width: 100%;
    }

    nav a:last-child {
      border: 1px solid rgba(255,255,255,.65);
      padding: 14px 20px;
    }

    nav a:last-child::after {
      display: none;
    }

    nav a:last-child:hover {
      background: var(--white);
      color: var(--burgundy);
    }


    /* =========================================================
       CONTACT PAGE
    ========================================================= */

    .contact-page {
      padding: 300px 0 120px;
      background: var(--ivory);
    }

    .contact-container {
      width: min(1380px, calc(100% - 100px));
      margin: 0 auto;
    }


    /* =========================================================
       TOP CONTACT AREA
       LEFT = HEADING
       RIGHT = FORM
    ========================================================= */

    .contact-main {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

      gap: 90px;

      align-items: start;
    }


    /* =========================================================
       LEFT SIDE
    ========================================================= */

    .contact-intro {
      max-width: 650px;
    }

    .eyebrow {
      color: var(--greige);

      font-size: 11px;
      font-weight: 800;

      letter-spacing: .28em;
      text-transform: uppercase;
    }

    .contact-intro h1 {
      margin-top: 38px;

      font-family: var(--serif);
      font-size: clamp(68px, 7.5vw, 118px);
      line-height: .88;
      font-weight: 400;
      letter-spacing: -.055em;
    }

    .contact-copy {
      max-width: 620px;

      margin-top: 52px;

      color: var(--greige);

      font-size: 16px;
      line-height: 1.85;
    }


    /* =========================================================
       BUTTON
    ========================================================= */

    .contact-actions {
      display: flex;
      flex-wrap: wrap;

      gap: 14px;

      margin-top: 38px;
    }

    .button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-height: 56px;

      padding: 0 30px;

      font-size: 10px;
      font-weight: 800;

      letter-spacing: .18em;
      text-transform: uppercase;

      transition:
        background .3s ease,
        color .3s ease,
        transform .3s ease;
    }

    .button-burgundy {
      background: var(--burgundy);
      color: var(--white);
    }

    .button-burgundy:hover {
      background: var(--charcoal);
      transform: translateY(-2px);
    }


    /* =========================================================
       CONTACT FORM
    ========================================================= */

    .contact-form-wrap {
      width: 100%;
    }

    .contact-form-intro {
      color: var(--greige);

      font-size: 14px;
      line-height: 1.7;

      margin-bottom: 32px;

      max-width: 550px;
    }

    .contact-form {
      width: 100%;

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 25px 20px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
    }

    .form-field.full {
      grid-column: 1 / -1;
    }

    .form-field label {
      color: var(--burgundy);

      font-size: 9px;
      font-weight: 800;

      letter-spacing: .22em;
      text-transform: uppercase;

      margin-bottom: 10px;
    }

    .form-field input,
    .form-field select,
    .form-field textarea {
      width: 100%;

      border: 1px solid var(--line);

      background: transparent;

      color: var(--charcoal);

      padding: 16px 17px;

      font-family: var(--sans);
      font-size: 14px;

      outline: none;

      transition:
        border-color .2s ease,
        background .2s ease;

      border-radius: 0;
    }

    .form-field input,
    .form-field select {
      min-height: 54px;
    }

    .form-field textarea {
      min-height: 150px;

      resize: vertical;

      line-height: 1.6;
    }

    .form-field input:focus,
    .form-field select:focus,
    .form-field textarea:focus {
      border-color: var(--burgundy);

      background: rgba(255,255,255,.35);
    }

    .form-field input::placeholder,
    .form-field textarea::placeholder {
      color: var(--greige);
      opacity: .75;
    }

    .form-submit {
      margin-top: 4px;

      width: 100%;

      border: 0;

      cursor: pointer;

      font-family: var(--sans);
    }

    .form-note {
      margin-top: 12px;

      color: var(--greige);

      font-size: 10px;

      line-height: 1.6;
    }

       CONTACT INFORMATION
       UNDERNEATH MAIN AREA
    ========================================================= */

      margin-top:
